[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-foundry"
version = "0.1.0"
description = "Scaffold a working Python agent project in one command: manifest, skill description, runnable entrypoint, and test suite. Standard library only."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
agent-foundry = "agent_foundry:main"

[tool.setuptools]
py-modules = ["agent_foundry"]
